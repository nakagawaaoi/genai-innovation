<head>

  <script>location.replace('/ai-services.html' + location.hash);</script>
  <meta http-equiv="refresh" content="0; url=/ai-services.html">

</head>
<body>
  <p>事業内容・料金プランのページは移動しました。<a href="/ai-services.html">新しいページ（事業内容・料金プラン）</a>をご覧ください。</p>
</body>
